# Alembic config: single entrypoint for schema migrations (baseline frozen 2026-08-22).
# Usage: DATABASE_URL=postgresql://... alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
# DSN is read from DATABASE_URL env var by migrations/env.py; keep empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
