# CareerCrew CI：轻量单测（配置加载 + AI 工厂契约，外部依赖全 mock，无需 API key）。
# 重 ML 栈（FlagEmbedding / torch / BGE-M3）由本地 conda env 验证（DEV_SPEC §4.4）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-check pydantic PyYAML python-dotenv numpy \
            "langgraph>=1.2.0" "langchain>=1.0.0" "langchain-core>=1.0.0" "langchain-openai>=1.0.0" "qdrant-client>=1.19.0" \
            "langgraph-checkpoint-sqlite>=3.0.0"
          pip install -e . --no-deps
      - name: Unit tests (config + AI factories)
        # 测试不调真实 API；只需让 validate_settings 通过（api_key 非空）
        env:
          SILICONFLOW_API_KEY: "sk-test-ci-dummy"
        run: |
          pytest -q tests/unit/test_config_loading.py tests/unit/test_ai_base_factories.py

  postgres-memory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careercrew
          POSTGRES_PASSWORD: careercrew
          POSTGRES_DB: careercrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercrew -d careercrew"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Postgres memory test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]>=3.1.0"
          pip install -e . --no-deps
      - name: Postgres episodic-memory regression test
        env:
          POSTGRES_TEST_DSN: postgresql://careercrew:careercrew@localhost:5432/careercrew
        run: |
          pytest -q tests/integration/test_postgres_memory_db.py
