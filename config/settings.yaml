# CareerCrew 主配置（结构对齐 DEV_SPEC §5.5）
# ${VAR} 占位由 careercrew_core/state/settings.py 的 load_settings 做环境变量替换

# ── LLM（硅基流动，OpenAI 兼容；init_chat_model 薄适配） ──
llm:
  provider: openai               # 走 init_chat_model 的 openai provider（OpenAI 兼容）
  model: "zai-org/GLM-4.5V"
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "${SILICONFLOW_API_KEY}"
  temperature: 0.3
  max_tokens: 2048

# ── Embedding（本地 BGE-M3 三合一：dense + sparse + colbert） ──
embedding:
  provider: bge_m3_local         # bge_m3_local | openai | siliconflow_dense
  model: BAAI/bge-m3
  model_path: F:/AI_models/BAAI--bge-m3/snapshots/master
  use_fp16: false                # CPU 跑关闭 fp16
  batch_size: 12

# ── Rerank（硅基流动 rerank API） ──
rerank:
  backend: siliconflow           # none | siliconflow | local_bge
  model: BAAI/bge-reranker-v2-m3
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "${SILICONFLOW_API_KEY}"
  top_m: 30                      # 精排候选数

# ── 向量库（Qdrant 唯一后端） ──
vector_store:
  backend: qdrant
  url: http://localhost:6333
  api_key: ""
  collections:
    knowledge: careercrew_mm
    episodic_memory: careercrew_episodic_v2

# ── RAG 检索（自建） ──
rag:
  retrieval:
    mode: hybrid                 # hybrid | dense | sparse
    fusion_algorithm: rrf        # rrf | weighted_sum
    top_k_dense: 20
    top_k_sparse: 20
    top_k_final: 10
  chunking:
    strategy: recursive          # recursive | semantic
    chunk_size: 800
    chunk_overlap: 100
    contextual: true             # Contextual Chunking（LLM 加上下文前置）
  loaders:
    backend: mineru              # MinerU 子进程解析（PDF/图片/docx/pptx/xlsx）
    provider: api                # api（云端精准解析，推荐，本机零推理负载）| local（本地子进程）
    api_key: "${MINERU_API_KEY}" # MinerU 云端 API token（provider=api 时必填）
    model_version: vlm           # pipeline | vlm（推荐）| MinerU-HTML
    poll_interval: 5             # API 轮询间隔（秒）
    timeout: 1800                # API 任务最长等待（秒）
    output_dir: ./data/parsed    # MinerU 产物落盘（页面图/对象裁剪图/Markdown）
    device: cpu                  # MinerU 子进程设备：cpu（8GB 显存机型避免 GPU OOM）
    method: auto                 # auto | txt（纯文本 PDF 最快）| ocr（强制 OCR）
    formula: true                # 公式识别开关；无公式文档关掉可显著提速
    table: true                  # 表格识别开关
    language: ch                 # 文档语言（API 参数）

# ── VLM（硅基流动，多模态生成 + 精排） ──
vlm:
  model: zai-org/GLM-4.5V
  rerank_model: Qwen/Qwen3-VL-Reranker-8B
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "${SILICONFLOW_API_KEY}"

# ── LangGraph supervisor ──
supervisor:
  checkpointer:
    backend: postgres            # 唯一后端：postgres
    url: "${DATABASE_URL}"
  max_consecutive_agent_turns: 10

# ── 记忆系统 ──
memory:
  enabled: false                 # 默认关闭（Codex 式治理：显式开启才写入/注入）
  postgres:
    dsn: "${DATABASE_URL}"
  episodic:
    collection: careercrew_episodic_v2
    vectorize: true
  compaction:
    enabled: true
    token_threshold_ratio: 0.7   # token 占比阈值（用模型真实 usage）
    retention_tokens: 20000      # 保留区大小
  router:
    top_n: 5                     # LLM 路由每次最多选出的语义事实数
    max_inject_tokens: 2000      # 自动注入总 token 预算
  consolidation:
    min_interval_hours: 24       # Auto Dream 式时间门控
    min_sessions: 5              # 距上次合并至少新增会话数

# ── 工具层 ──
tools:
  registry:
    # internal 须与 `_make_tools(kind)` 实际构造的工具集对齐：search_jobs(matcher) /
    # salary_query(planner+salary) / read_image(knowledge) 均真实落入 bound tools，
    # 必须登记在此，否则默认路径（未传 tools）会把它们从 bound 集合裁剪掉以致功能回归。
    internal: [rag_query, memory_search, memory_write, profile_update, search_jobs, salary_query, read_image, submit_application]
    mcp: [mcp_jobs, google_mcp]
  hitl:
    requires_confirmation:
      - submit_application

# ── HITL 默认策略 ──
hitl:
  default_policy: confirm        # 默认 HITL，仅低风险自动化

# ── LangSmith 全链路追踪 ──
langsmith:
  enabled: true
  project: careercrew
  api_key: "${LANGSMITH_API_KEY}"
  masking: true              # 默认脱敏：截断 + 打码手机号/邮箱/薪资
  max_chars: 2000            # 单条字符串上传上限（超出截断）

# ── 阿里云 OSS（头像等文件存储；未配置时回退本地 data/uploads） ──
oss:
  endpoint: "${OSS_ENDPOINT}"
  access_key_id: "${OSS_ACCESS_KEY_ID}"
  access_key_secret: "${OSS_ACCESS_KEY_SECRET}"
  bucket_name: "${OSS_BUCKET_NAME}"
  dir_prefix: uploads             # 对象键前缀：头像落在 {dir_prefix}/avatars/{user_id}/...

# ── 本地账号认证 ──
# 账号/刷新会话存 Postgres（唯一后端；AUTH_DATABASE_URL 未设置时回退 DATABASE_URL）。
auth:
  environment: development   # 可用 CAREERCREW_ENV 覆盖为 production
  database_url: "${AUTH_DATABASE_URL}"
  trusted_origins: ["http://localhost:5175", "http://127.0.0.1:5175", "http://localhost:8000", "http://127.0.0.1:8000"]
  login_max_failures: 5
  login_failure_window_minutes: 15
  login_lock_minutes: 15
  cleanup_interval_hours: 6
  jwt_secret: "${AUTH_JWT_SECRET}"
  access_token_minutes: 15
  refresh_token_days: 7
  cookie_secure: false       # 生产环境必须为 true
