[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercrew"
version = "0.1.0"
description = "CareerCrew — 多智能体职业顾问团队（职位匹配/简历/面试/谈薪/规划，长期陪跑求职周期）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "CareerCrew" }]

# 核心依赖：A1 验收所需（langgraph / langchain / pymilvus / FlagEmbedding 等可 import）
# 重 ML 栈（FlagEmbedding / modelscope / sentence-transformers / torch）env 中已装，列出仅为可复现
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pymilvus>=2.4.0",
    "FlagEmbedding>=1.4.0",
    "modelscope>=1.39.0",
    "sentence-transformers>=5.0.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# milvus-lite 嵌入式后端（D2 阶段用；Windows wheel 单独装，不阻塞 A1）
milvus = ["milvus-lite>=2.4.0"]
# 多格式文档加载（D4 阶段用：PDF/Word/Excel -> Markdown）
ingestion = ["markitdown>=0.0.1"]
# 答案级评估（L1 阶段用）
eval = ["ragas>=0.2.0"]
# Streamlit Dashboard（L4 阶段用）
ui = ["streamlit>=1.30.0"]
# 测试工具链（A2 起用）
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-check>=2.0.0",
]

[project.scripts]
careercrew = "careercrew_cli.app:main"

[tool.setuptools.packages.find]
include = ["careercrew_ai", "careercrew_ai.*", "careercrew_core", "careercrew_core.*", "careercrew_cli", "careercrew_cli.*", "careercrew_ui", "careercrew_ui.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "integration: 多组件协作集成测试",
    "e2e: 求职闭环端到端测试",
    "slow: 慢测试（真实后端 / 大模型加载）",
]
