[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercrew"
version = "0.1.0"
description = "CareerCrew — 多智能体职业顾问团队（职位匹配/简历/面试/谈薪/规划，长期陪跑求职周期）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "CareerCrew" }]

# 核心依赖：A1 验收所需（langgraph / langchain / pymilvus / FlagEmbedding 等可 import）
# 重 ML 栈（FlagEmbedding / modelscope / sentence-transformers / torch）env 中已装，列出仅为可复现
dependencies = [
    "langgraph>=1.2.0",   # 1.x API（interrupt/Command/SqliteSaver），见 DEV_SPEC §3.1.6
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.10",
    "FlagEmbedding>=1.4.0",
    "modelscope>=1.39.0",
    "sentence-transformers>=5.0.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.19.0",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    "mcp>=1.20,<2",
]

[project.optional-dependencies]
# 答案级评估（L1 阶段用）
eval = ["ragas>=0.2.0"]
# Web 前端后端：FastAPI + SSE 流式（uvicorn/multipart 已在 env，实际只补 fastapi）
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# 测试工具链（A2 起用）
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-check>=2.0.0",
]

[project.scripts]
careercrew = "careercrew_cli.app:main"
careercrew-mcp = "careercrew_mcp.server:main"

[tool.setuptools.packages.find]
include = ["careercrew_ai", "careercrew_ai.*", "careercrew_core", "careercrew_core.*", "careercrew_cli", "careercrew_cli.*", "careercrew_ui", "careercrew_ui.*", "careercrew_api", "careercrew_api.*", "careercrew_mcp", "careercrew_mcp.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "integration: 多组件协作集成测试",
    "e2e: 求职闭环端到端测试",
    "slow: 慢测试（真实后端 / 大模型加载）",
    "web: Web API 测试（FastAPI + FakeRuntime，CI 默认不跑）",
]
